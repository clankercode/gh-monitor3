[package]
name = "gh-monitor3"
version = "0.1.0"
edition = "2024"
description = "A lightweight native transparent overlay for monitoring GitHub activity"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/gh-monitor3"
readme = "README.md"
keywords = ["github", "overlay", "monitor", "timeline"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "gh-monitor3"
path = "src/main.rs"

[dependencies]
# Windowing and rendering
winit = { version = "0.30", features = ["rwh_06"] }
wgpu = "29"
glyphon = "0.11"
bytemuck = { version = "1", features = ["derive"] }

# GitHub API
octocrab = "0.53"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Utils
open = "5"
dirs = "6"
pollster = "0.4"
time = ">=0.3.36,<0.3.45"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
tempfile = "3"
mockall = "0.13"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
